<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIP 上传 · TenantLog 交付站</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#102338;background:#f4f9ff}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:32px;display:grid;place-items:center;background:radial-gradient(circle at 85% 10%,#cef4f2,transparent 32%),linear-gradient(140deg,#f8fbff,#eaf3fc)}main{width:min(700px,100%);padding:clamp(25px,5vw,54px);background:#ffffffdd;border:1px solid #fff;border-radius:30px;box-shadow:0 25px 80px #173c6b20}.tag{font-size:12px;letter-spacing:.2em;color:#2867ff;font-weight:800}h1{font-size:clamp(34px,6vw,54px);letter-spacing:-.04em;margin:12px 0}p{color:#536d84;line-height:1.7}.panel{margin-top:28px;padding:25px;border:1px solid #d9e9f4;border-radius:20px;background:#fff}label{display:block;margin:14px 0 7px;font-size:13px;font-weight:700}input{width:100%;border:1px solid #c8dce9;border-radius:12px;padding:14px;font:inherit;outline:none}input:focus{border-color:#2867ff;box-shadow:0 0 0 3px #2867ff22}button{border:0;border-radius:12px;padding:14px 20px;background:linear-gradient(135deg,#2867ff,#2ac3d0);color:#fff;font-weight:750;font-size:15px;cursor:pointer;margin-top:20px}button:disabled{opacity:.5;cursor:wait}.drop{border:2px dashed #a7c9e5;border-radius:18px;background:#f7fbff;padding:30px;text-align:center;cursor:pointer}.drop.drag{background:#e5f6ff;border-color:#2867ff}.drop input{display:none}.muted{font-size:12px}.result{margin-top:20px;min-height:25px;word-break:break-all}.error{color:#bb2548}.ok{color:#096e4d}a{color:#2867ff;text-decoration:none}nav{margin-bottom:20px}nav a{font-size:13px}.hide{display:none}
</style></head><body><main><nav><a href="./">← 返回下载站</a></nav><div class="tag">SECURE ZIP PUBLISHING</div><h1>上传新的 ZIP 交付包</h1><p>登录后选择 ZIP。上传成功后，文件会发布到本站的公开下载目录。请只上传允许公开分发的内容，文件大小不超过 25 MB。</p>
<section class="panel" id="loginBox"><h2>管理员登录</h2><form id="loginForm"><label for="user">用户名</label><input id="user" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">登录</button></form></section>
<section class="panel hide" id="uploadBox"><h2>选择 ZIP 文件</h2><label class="drop" id="drop" for="file"><strong id="filename">点击选择或拖入 ZIP</strong><br><span class="muted">英文、数字、点、短横线、下划线命名；最多 25 MB</span><input id="file" type="file" accept=".zip,application/zip"></label><button id="uploadBtn" disabled>上传并发布</button></section>
<div class="result" id="result" role="status" aria-live="polite"></div></main>
<script>
const api='https://tianjishu.hrlink.com.cn/api/tenantlog-upload';let token='';const $=id=>document.getElementById(id),set=(message,ok=false)=>{const el=$('result');el.className='result '+(ok?'ok':'error');el.textContent=message};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;set('');try{const response=await fetch(api+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({User:$('user').value,Password:$('password').value})});if(!response.ok)throw Error('登录失败，请检查账号和密码');token=(await response.json()).token;$('password').value='';$('loginBox').classList.add('hide');$('uploadBox').classList.remove('hide');set('已登录。请选择要公开发布的 ZIP。',true)}catch(error){set(error.message)}finally{$('loginBtn').disabled=false}});
$('file').addEventListener('change',()=>{const f=$('file').files[0];$('filename').textContent=f?f.name:'点击选择或拖入 ZIP';$('uploadBtn').disabled=!f});
for(const name of ['dragenter','dragover'])$('drop').addEventListener(name,e=>{e.preventDefault();$('drop').classList.add('drag')});
for(const name of ['dragleave','drop'])$('drop').addEventListener(name,e=>{e.preventDefault();$('drop').classList.remove('drag')});
$('drop').addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(!f)return;const dt=new DataTransfer();dt.items.add(f);$('file').files=dt.files;$('file').dispatchEvent(new Event('change'))});
$('uploadBtn').addEventListener('click',async()=>{const file=$('file').files[0];if(!file)return;if(!file.name.endsWith('.zip')||file.size>25*1024*1024){set('请选择 25 MB 以内的 ZIP 文件');return}$('uploadBtn').disabled=true;set('正在上传并发布，请稍候…',true);try{const form=new FormData();form.append('file',file);const response=await fetch(api+'/files',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});if(!response.ok){const detail=(await response.text()).trim();throw Error('发布失败：'+detail)}const data=await response.json();$('result').innerHTML='发布成功。<a href="'+encodeURI(data.url)+'" target="_blank" rel="noopener">打开下载链接</a>。GitHub Pages 缓存更新可能需要几分钟。';$('result').className='result ok'}catch(error){set(error.message)}finally{$('uploadBtn').disabled=false}});
</script></body></html>
